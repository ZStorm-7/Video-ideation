name: release
# Push a tag like v1.0.0 and this attaches idea-scout.zip (the Claude app install file) to a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/build_zip.py --out idea-scout.zip
      - name: Create the release with the ZIP attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" idea-scout.zip --title "$GITHUB_REF_NAME" --generate-notes
